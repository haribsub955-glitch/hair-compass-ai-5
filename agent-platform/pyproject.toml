[project]
name = "agent-platform"
version = "0.1.0"
description = "Server-authoritative agent platform for mobile apps"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "httpx",
    "sqlalchemy>=2",
    "alembic",
    "asyncpg",
    "ruamel.yaml",
    # App Attest: ECDSA signature verification and the CBOR attestation object. Both are
    # standards work with subtle failure modes — a hand-rolled ASN.1 parser accepting a malformed
    # signature is how an attestation check becomes decoration (CLAUDE.md OSF: adopt, don't build).
    "cryptography>=42",
    "cbor2>=5.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core", "src/agent_server"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# B008 flags `Depends()`/`File()`/`Form()` in argument defaults. That IS the FastAPI idiom — the
# call is a declaration the framework reads, not a value evaluated per request.
"src/agent_server/api.py" = ["B008"]
# RUF001/RUF002 flag Arabic letters as "ambiguous" look-alikes for Latin ones. In a locale pack and
# its tests, Arabic text IS the content — the rule fires on every line that does its job.
"src/agent_server/packs/hair_compass_locales.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_locales_arabic.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
